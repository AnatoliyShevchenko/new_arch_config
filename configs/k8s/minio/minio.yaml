apiVersion: v1
kind: PersistentVolume
metadata:
  name: minio-data
spec:
  capacity:
    storage: 200Gi                 # информационно, реальный предел — свободное место на диске
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual-hdd
  local:
    path: /HDD-WD/minio
  nodeAffinity:                    # для local PV обязательно: этот каталог есть только на этой ноде
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: ["brick-desktop"]
  claimRef:                        # заранее закрепляем за PVC, который создаст StatefulSet
    namespace: minio
    name: data-minio-0             # <имя шаблона>-<имя StatefulSet>-<номер>

---

apiVersion: v1
kind: Service
metadata:
  name: minio-headless
  namespace: minio
spec:
  clusterIP: None
  selector:
    app: minio
  ports:
    - name: api
      port: 9000

---

apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: minio
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: minio
spec:
  serviceName: minio-headless
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      securityContext:
        runAsUser: 1000            # образ по умолчанию запускается от root, здесь это не нужно
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: minio
          image: harbor.sc-discovery.ru/base-images/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
          imagePullPolicy: IfNotPresent
          args: ["server", "/data", "--console-address", ":9001"]
          envFrom:
            - secretRef:
                name: minio-root   # MINIO_ROOT_USER и MINIO_ROOT_PASSWORD
          env:
            # консоль стоит за прокси, ей нужно знать свой внешний адрес для редиректов
            - name: MINIO_BROWSER_REDIRECT_URL
              value: https://minio.temp-brick.asia
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          # у MinIO есть HTTP-эндпоинты здоровья без авторизации
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 20

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: manual-hdd   # тот же, что у PV
        resources:
          requests:
            storage: 200Gi              # не больше, чем capacity у PV

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio
  namespace: minio
spec:
  ingressClassName: traefik
  rules:
    - host: s3.temp-brick.asia
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9000
    - host: minio.temp-brick.asia
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9001