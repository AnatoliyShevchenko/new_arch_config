apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-temp-brick-asia-staging
  namespace: kube-system
spec:
  secretName: wildcard-temp-brick-asia-staging-tls
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
  dnsNames:
    - "*.temp-brick.asia"
    - "temp-brick.asia"
