# Jellyfin держит /HDD-WD/jellyfin как hostPath. Без этой строки systemd
# пытается отмонтировать диск раньше, чем останавливается k3s, и получает
# "target is busy". RequiresMountsFor= даёт порядок и при старте, и при
# остановке: k3s гарантированно уходит до umount.
[Unit]
RequiresMountsFor=/HDD-WD
