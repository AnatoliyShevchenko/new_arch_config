font_family      MesloLGS Nerd Font
font_size        13.0
background_opacity 0.85
tab_bar_style powerline
tab_powerline_style slanted
shell /usr/bin/zsh


# BEGIN_KITTY_THEME
# Homebrew
include current-theme.conf
# END_KITTY_THEME

enabled_layouts splits,stack
map ctrl+shift+\ launch --location=vsplit --cwd=current
map ctrl+shift+minus launch --location=hsplit --cwd=current
map alt+left neighboring_window left
map alt+right neighboring_window right
map alt+up neighboring_window up
map alt+down neighboring_window down
map ctrl+shift+z toggle_layout stack
map ctrl+shift+t launch --type=tab --cwd=current
map ctrl+alt+m detach_window tab-prev
map ctrl+alt+b detach_window new-tab
